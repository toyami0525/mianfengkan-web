name: Verify staff and payroll update
on:
  push:
    branches: [update/performers-payroll-20261014]
    paths: [.github/mf-update/RUN]
permissions:
  contents: write
jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: update/performers-payroll-20261014
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact source edits
        run: python3 .github/mf-update/apply.py
      - name: Install build dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify payroll rules and browser script syntax
        run: |
          node scripts/test-payroll-roster.cjs
          node --check public/assets/staff-directory.js
          node --check public/assets/house-cat.js
      - name: Verify production compilation without live database credentials
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-public-key
          SUPABASE_SERVICE_ROLE_KEY: test-service-key
        run: npm run build
      - name: Commit verified source edits to the isolated update branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/AdminApp.tsx public/staff.html public/assets/staff-directory.js public/assets/house-cat.js
          git diff --cached --stat
          git commit -m 'Apply verified photographer, performer category and payroll companion integration'
          git push origin HEAD:update/performers-payroll-20261014
