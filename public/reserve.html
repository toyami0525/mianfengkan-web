<!doctype html><html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>預約／指名｜眠楓館</title><link rel="stylesheet" href="assets/style.css"></head><body>
<header class="site-header"><nav class="nav"><a class="brand" href="index.html"><span class="brand-mark">楓</span><span><strong>眠楓館</strong><small>MIANFENGKAN</small></span></a><button class="menu-btn" aria-expanded="false">☰</button><div class="nav-links"><a href="about.html">館內介紹</a><a href="services.html">服務項目</a><a href="staff.html">館員介紹</a><a href="menu.html">餐食價目</a><a href="rules.html">來館須知</a><a href="location.html">位置</a><a class="reserve-link active" href="reserve.html">預約／指名</a><a class="order-link" href="order.html">我要點餐</a></div></nav></header>
<main class="page"><header class="page-title"><span class="eyebrow">Reservation</span><h1>預約／指名</h1></header><div class="booking-shell"><aside class="booking-note"><span class="eyebrow">Choose Your Host</span><h2>今晚，想由誰陪伴您？</h2><p>選擇館員、服務內容與希望時段後，即可送出預約需求。</p><div class="staff-select" id="staffSelect"></div></aside><section class="form-panel"><form id="bookingForm"><div class="form-grid"><div class="field"><label>客人名稱</label><input id="guest" placeholder="角色名稱" required></div><div class="field"><label>服務項目</label><select id="service" required>
<option value="泡湯搓澡" data-price="150000">泡湯搓澡｜15 分鐘｜150,000 Gil</option>
<option value="按摩服務" data-price="100000">按摩服務｜15 分鐘｜100,000 Gil</option>
<option value="耳語陪伴" data-price="100000">耳語陪伴｜15 分鐘｜100,000 Gil</option>
<option value="眠楓套席" data-price="300000">眠楓套席（優惠價）｜300,000 Gil</option>
</select></div><div class="field"><label>服務金額</label><div class="booking-price" id="servicePrice">150,000 Gil</div></div><div class="field full"><label>希望時段</label><div class="booking-time-picker"><div class="time-date-row"><input id="bookingDate" type="date" required><select id="bookingHour" aria-label="選擇小時" required></select></div><div class="minute-slots" id="minuteSlots" aria-label="選擇分鐘"></div></div><input id="time" type="hidden" required><small class="field-help">分鐘固定為 00、15、30、45；灰色時段表示已有確認預約，或館員請假／暫停開放。</small><div class="availability-message" id="availabilityMessage" aria-live="polite"></div></div><div class="field full"><label>備註</label><textarea id="note" rows="5" placeholder="偏好的互動節奏、第一次來館、希望安靜聊天……"></textarea></div></div><div class="booking-summary" id="bookingSummary"></div><button class="submit" id="bookingSubmit" type="submit">送出預約需求</button></form></section></div></main>
<div class="toast"></div>
<div class="booking-modal" id="bookingSuccessModal" role="dialog" aria-modal="true" aria-labelledby="bookingSuccessTitle" aria-hidden="true">
  <div class="booking-modal-card">
    <div class="booking-modal-mark">楓</div>
    <h2 id="bookingSuccessTitle">感謝您的預約</h2>
    <p>提醒您，請務必規劃好時間並<strong>提早抵達本館</strong>。<br>若有遲到情形，本館將不補足服務時數，敬請見諒。</p>
    <button class="booking-modal-close" id="bookingSuccessClose" type="button">我知道了</button>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase-config.js"></script>
<script src="assets/script.js"></script>
<script src="assets/booking-v12.js"></script></body></html>
