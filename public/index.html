    .home-slide:nth-child(1){background-image:url('assets/images/home-01.webp');background-position:center 48%}
    .home-slide:nth-child(2){background-image:url('assets/images/home-02.webp');background-position:center 47%}

    .home-shade{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:.3s}
    .home-shade.show{opacity:1;pointer-events:auto}
    @keyframes homeFade{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
    @keyframes mapleDrift{0%,100%{translate:0 0;rotate:0deg}50%{translate:14px 22px;rotate:7deg}}
    @keyframes slideProgress{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    @media(max-width:700px){
      .home-slide:nth-child(1){background-position:52% center}.home-slide:nth-child(2){background-position:57% center}.home-slide:nth-child(3){background-position:55% center}

  <script>
    const btn=document.getElementById('homeMenu');
    const drawer=document.getElementById('homeDrawer');
    const shade=document.getElementById('homeShade');
    function toggle(open){
      drawer.classList.toggle('open',open);
      shade.classList.toggle('show',open);
      btn.setAttribute('aria-expanded',String(open));
      btn.textContent=open?'CLOSE':'MENU';
    }
    btn.addEventListener('click',()=>toggle(!drawer.classList.contains('open')));
    shade.addEventListener('click',()=>toggle(false));
    document.addEventListener('keydown',e=>{if(e.key==='Escape')toggle(false)});

    const slides=[...document.querySelectorAll('.home-slide')];
    let current=0;
    function showSlide(index){
      current=(index+slides.length)%slides.length;
      slides.forEach((slide,i)=>slide.classList.toggle('active',i===current));
    }
    setInterval(()=>showSlide(current+1),7000);
  </script>
