<!doctype html><html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>拍立得領取｜眠楓館</title><link rel="stylesheet" href="assets/style.css"><style>
.pickup-wrap{max-width:760px;margin:0 auto}.pickup-card{background:rgba(255,252,248,.96);border:1px solid #e6d7cd;border-radius:26px;padding:clamp(24px,5vw,46px);box-shadow:0 22px 70px rgba(56,35,28,.1);text-align:center}.pickup-card h2{font-size:clamp(28px,5vw,42px);margin:8px 0 12px}.pickup-card>p{color:#6f5d55;line-height:1.9}.pickup-form{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;margin:28px auto 0;max-width:560px;align-items:stretch}.pickup-form input{width:100%;box-sizing:border-box;min-width:0;border:1px solid #d8c7ba;background:#fffdf8;border-radius:14px;padding:15px 16px;text-transform:uppercase;letter-spacing:.12em;font-size:18px;text-align:center;outline:none}.pickup-form input:focus{border-color:#8b4c3f;box-shadow:0 0 0 3px rgba(139,76,63,.08)}.pickup-form button{width:auto!important;margin-top:0!important;min-width:170px;white-space:nowrap;padding-inline:24px}.pickup-result{margin-top:26px}.pickup-status{padding:24px;border-radius:18px;background:#f7f0ea}.pickup-status h3{margin:5px 0 8px}.pickup-code{font-size:1.35rem;letter-spacing:.12em}.pickup-photo{margin-top:20px;padding:18px;background:#fff;border:1px solid #eadfd8;border-radius:18px}.pickup-photo img{display:block;width:100%;max-height:70vh;object-fit:contain;border-radius:10px}.pickup-download{display:inline-block;margin-top:16px;padding:12px 22px;border-radius:12px;background:#7e302c;color:#fff;text-decoration:none;font-weight:700}@media(max-width:600px){.pickup-form{grid-template-columns:1fr}.pickup-form button{width:100%!important;min-width:0}}
</style></head><body>
<header class="site-header"><nav class="nav"><a class="brand" href="index.html"><span class="brand-mark">楓</span><span><strong>眠楓館</strong><small>MIANFENGKAN</small></span></a><button class="menu-btn" aria-expanded="false">☰</button><div class="nav-links"><a href="about.html">館內介紹</a><a href="services.html">服務項目</a><a href="staff.html">館員介紹</a><a href="menu.html">餐食價目</a><a href="rules.html">來館須知</a><a href="location.html">位置</a><a class="active" href="polaroid.html">拍立得領取</a><a class="reserve-link" href="reserve.html">預約／點餐</a></div></nav></header>
<main class="page"><header class="page-title"><span class="eyebrow">POLAROID PICKUP</span><h1>拍立得領取</h1><p>輸入預約完成時取得的隨機取件碼，即可查看製作進度或領取成品。</p></header><div class="pickup-wrap"><section class="pickup-card"><span class="eyebrow">YOUR MEMORY</span><h2>尋找您的回憶</h2><p>取件碼格式為 <b>MF-XXXXXX</b>。館員完成拍攝與題字並上傳後，即可於此查看。</p><form class="pickup-form" id="pickupForm"><input id="pickupCode" autocomplete="off" maxlength="9" placeholder="MF-7K3P92" aria-label="拍立得取件碼"><button class="submit" type="submit">尋找拍立得</button></form><div class="pickup-result" id="pickupResult" aria-live="polite"></div></section></div></main>
<div class="toast"></div><script src="assets/script.js"></script><script>
const form=document.getElementById('pickupForm'),input=document.getElementById('pickupCode'),result=document.getElementById('pickupResult');
input.addEventListener('input',()=>{let v=input.value.toUpperCase().replace(/[^A-Z2-9-]/g,'');if(v&&!v.startsWith('MF-')&&!v.startsWith('MF'))v='MF-'+v;if(v.startsWith('MF')&&!v.startsWith('MF-')&&v.length>2)v='MF-'+v.slice(2);input.value=v.slice(0,9)});
form.addEventListener('submit',async e=>{e.preventDefault();const code=input.value.trim().toUpperCase();result.innerHTML='<div class="pickup-status">查詢中…</div>';try{const r=await fetch('/api/polaroid-pickup?code='+encodeURIComponent(code),{cache:'no-store'}),j=await r.json();if(!r.ok)throw new Error(j.error||'查詢失敗');if(j.status==='processing'){result.innerHTML=`<div class="pickup-status"><span class="eyebrow">IN PROGRESS</span><h3>拍立得製作中</h3><div class="pickup-code">${j.pickup_code}</div><p>${j.staff_name} 正在為您準備成品，請稍後使用相同取件碼再次查詢。</p></div>`}else{result.innerHTML=`<div class="pickup-status"><span class="eyebrow">READY</span><h3>您的紀念拍立得已完成</h3><div class="pickup-code">${j.pickup_code}</div><p>拍攝館員：${j.staff_name}</p></div><div class="pickup-photo"><img src="${j.image_url}" alt="紀念拍立得"><a class="pickup-download" href="${j.image_url}" target="_blank" rel="noopener">開啟原圖／儲存</a></div>`}}catch(err){result.innerHTML=`<div class="pickup-status"><h3>找不到拍立得</h3><p>${err instanceof Error?err.message:'請確認取件碼後再試。'}</p></div>`}});
</script></body></html>
